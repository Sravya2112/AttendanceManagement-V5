<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduManage</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Check Auth
        if(localStorage.getItem('auth_token')) {
            window.location.href = '/index.html';
        }
    </script>
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-container fade-in-up">
            <div class="login-header">
                <i class="fa-solid fa-user-shield logo-icon" style="font-size: 32px; margin-bottom: 12px;"></i>
                <h2>Welcome Back</h2>
                <p>Sign in to EduManage dashboard</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" required placeholder="admin">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="admin123">
                </div>
                <button type="submit" class="btn btn-primary login-btn shadow-hover">Sign In <i class="fa-solid fa-arrow-right"></i></button>
            </form>
            <div id="login-error" class="login-error"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('login-error');
            
            try {
                const res = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('auth_token', data.token);
                    window.location.href = '/index.html';
                } else {
                    err.style.display = 'block';
                    err.textContent = data.message || 'Invalid credentials';
                }
            } catch(e) {
                err.style.display = 'block';
                err.textContent = 'Server is unreachable. Please make sure the backend is running.';
            }
        });
    </script>
</body>
</html>
